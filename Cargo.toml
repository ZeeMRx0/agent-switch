[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/menubar"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
rustix = { version = "1", features = ["fs"] }
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
